services:
  cgit:
    build: .
    image: cgit:latest
    # image: ghcr.io/kalex3/cgit:latest
    container_name: cgit
    restart: unless-stopped
    # read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - cgit-cache:/var/cache/cgit
      - ./git:/srv/git:ro
      - ./README.md:/usr/share/webapps/cgit/about.md:ro
      # - ./cgitrc:/etc/cgitrc:ro
      # - ./lighttpd.conf:/etc/lighttpd/lighttpd.conf:ro
      # - ./style.css:/usr/share/webapps/cgit/cgit.css:ro
      # - ./logo.png:/usr/share/webapps/cgit/cgit.png:ro
      # - ./favicon.ico:/usr/share/webapps/cgit/favicon.ico:ro
volumes:
  cgit-cache:
